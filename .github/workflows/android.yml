name: App Android

# Builds the Android app (APK) and publishes it at:
# https://github.com/sonyhelthon/cameras-app/releases/tag/app-android
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar projeto Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npm ci
          # Push notifications: only when the Firebase file is in the repository secrets.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf 'window.PUSH_ENABLED = true;\n' > www/build-config.js
            echo "Notificações push: ativadas"
          else
            echo "Notificações push: desativadas (falta o secret GOOGLE_SERVICES_JSON)"
          fi
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          node scripts/patch-android.mjs
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SHCAM.apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: App Android
          make_latest: true
          files: mobile/SHCAM.apk
          body: |
            Baixe **SHCAM.apk** abaixo pelo celular Android e instale
            (permita "instalar apps desconhecidos" para o navegador quando pedir).
            Versão gerada a partir do commit ${{ github.sha }}.
