# OPCIONAL. Não é preciso criar este arquivo: câmeras, Google Drive, gravação e senha
# são configurados pelo próprio app (aba "Ajustes").
#
# Use só se quiser mudar a porta ou a pasta onde ficam os dados:
# copie para "config.yaml" e ajuste.

server:
  port: 8080

# Onde ficam as gravações recentes e os dados do app
dataDir: ./data

# Caminho dos programas, só se você já tiver instalado em outro lugar.
# No Windows, o app baixa os dois sozinho na pasta "bin" se não encontrar.
# bin:
#   ffmpeg: C:/cameras/bin/ffmpeg.exe
#   rclone: C:/cameras/bin/rclone.exe
