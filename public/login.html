<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <title>Entrar · Câmeras</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <form id="login" class="login">
    <img src="/icon.svg" alt="" width="56" height="56">
    <h1>Minhas Câmeras</h1>
    <input type="password" name="password" placeholder="Senha" autocomplete="current-password" required autofocus>
    <button type="submit">Entrar</button>
    <p id="err" class="error" role="alert"></p>
  </form>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = e.target.password.value;
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
      if (r.ok) location.href = '/';
      else document.getElementById('err').textContent = (await r.json().catch(() => ({}))).error || 'Erro ao entrar';
    });
  </script>
</body>
</html>
