<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <title>Entrar · SHCAM</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <form id="login" class="login">
    <img src="/icon.svg" alt="" width="56" height="56">
    <h1>SHCAM</h1>
    <p id="intro" class="muted" hidden>Primeiro acesso: crie a senha que vai proteger o app.</p>
    <input type="password" name="password" placeholder="Senha" autocomplete="current-password" required autofocus>
    <input type="password" name="confirm" placeholder="Repita a senha" autocomplete="new-password" hidden>
    <button type="submit">Entrar</button>
    <p id="err" class="error" role="alert"></p>
  </form>
  <script>
    let setup = false;
    try { if (new URLSearchParams(location.search).get('app') === '1') sessionStorage.setItem('inApp', '1'); } catch {}
    const f = document.getElementById('login');
    if (new URLSearchParams(location.search).has('removido')) {
      document.getElementById('err').textContent = 'Seu acesso a este local foi removido. Peça um novo convite ao administrador.';
    }
    fetch('/api/auth/state').then((r) => r.json()).then((s) => {
      setup = s.needsSetup;
      if (!setup) return;
      document.getElementById('intro').hidden = false;
      f.confirm.hidden = false;
      f.confirm.required = true;
      f.password.autocomplete = 'new-password';
      f.querySelector('button').textContent = 'Criar senha e entrar';
    });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      if (setup && f.password.value !== f.confirm.value) return (err.textContent = 'As senhas não são iguais.');
      const r = await fetch(setup ? '/api/setup' : '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: f.password.value }),
      });
      if (r.ok) location.href = '/';
      else err.textContent = (await r.json().catch(() => ({}))).error || 'Erro ao entrar';
    });
  </script>
</body>
</html>
